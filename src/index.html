<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Atlas 3D interactivo del cerebro humano para estudiantes de Psicología: lóbulos, áreas funcionales, sistema límbico, ganglios basales, tronco, recorridos guiados, casos clínicos y autoevaluación. Funciona sin conexión.">
<meta name="theme-color" content="#0c1226">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Cpath d='M24 7c-3.4 0-6 1.8-7 4.4-3.7.2-6.6 3.1-6.6 6.8 0 .9.2 1.7.5 2.5-2.1 1.3-3.4 3.6-3.4 6.2 0 3.5 2.4 6.4 5.6 7.2.8 3.5 3.9 6 7.6 6 1.4 0 2.6-.4 3.3-1V7.1Zm0 0c3.4 0 6 1.8 7 4.4 3.7.2 6.6 3.1 6.6 6.8 0 .9-.2 1.7-.5 2.5 2.1 1.3 3.4 3.6 3.4 6.2 0 3.5-2.4 6.4-5.6 7.2-.8 3.5-3.9 6-7.6 6-1.4 0-2.6-.4-3.3-1' stroke='%238ab4ff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Atlas 3D del Cerebro</title>
<!-- @css -->
</head>
<body>
<div id="loading" role="status"><div class="spinner"></div><p id="loadMsg">Construyendo el cerebro 3D…</p><div id="loadBar"><div></div></div></div>

<canvas id="view" tabindex="0" aria-label="Modelo 3D del cerebro. Arrastra para girar, rueda para acercar, clic para seleccionar una estructura."></canvas>
<div id="labels"></div>
<div id="tooltip" class="hidden" role="tooltip"></div>
<div id="toast" class="hidden" role="status"></div>
<svg id="compass" viewBox="-50 -50 100 100" aria-hidden="true"></svg>

<header id="brand">
  <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ab4ff"/><stop offset="1" stop-color="#c4a7ff"/></linearGradient></defs><path d="M24 7c-3.4 0-6 1.8-7 4.4-3.7.2-6.6 3.1-6.6 6.8 0 .9.2 1.7.5 2.5-2.1 1.3-3.4 3.6-3.4 6.2 0 3.5 2.4 6.4 5.6 7.2.8 3.5 3.9 6 7.6 6 1.4 0 2.6-.4 3.3-1V7.1Zm0 0c3.4 0 6 1.8 7 4.4 3.7.2 6.6 3.1 6.6 6.8 0 .9-.2 1.7-.5 2.5 2.1 1.3 3.4 3.6 3.4 6.2 0 3.5-2.4 6.4-5.6 7.2-.8 3.5-3.9 6-7.6 6-1.4 0-2.6-.4-3.3-1" stroke="url(#lg)" stroke-width="2.4" stroke-linejoin="round"/><path d="M17 17c2 0 3.5 1.2 3.5 3.4M14 27c2.2-.6 4.6.3 5.4 2.6M31 17c-2 0-3.5 1.2-3.5 3.4M34 27c-2.2-.6-4.6.3-5.4 2.6" stroke="url(#lg)" stroke-width="2" stroke-linecap="round"/></svg>
  <div><h1>Atlas 3D del Cerebro</h1><p>Guía interactiva de neuroanatomía para Psicología</p></div>
</header>

<nav id="topnav" class="panel" aria-label="Principal">
  <button class="btn mobile-only" id="btnLeft">Partes</button>
  <button class="btn" id="btnGuide"><span class="lg">Guía de estudio</span><span class="sh">Guía</span></button>
  <button class="btn" id="btnTours"><span class="lg">Recorridos</span><span class="sh">Recorridos</span></button>
  <button class="btn primary" id="btnQuiz">Autoevaluación</button>
  <button class="btn" id="btnGlossary">Glosario</button>
  <button class="btn" id="btnReset" title="Restablecer todo (R)"><span class="lg">Reiniciar</span><span class="sh">↺</span></button>
  <div id="menuWrap">
    <button class="btn" id="btnMore" aria-haspopup="true" aria-expanded="false" aria-label="Más opciones">⋯</button>
    <div id="menu" role="menu">
      <button id="mShare" role="menuitem">Copiar enlace a esta vista</button>
      <button id="mShot" role="menuitem">Descargar captura PNG</button>
      <button id="mPrint" role="menuitem">Imprimir ficha actual</button>
      <button id="mPrintAll" role="menuitem">Imprimir resumen de estudio</button>
      <hr>
      <button id="mTheme" role="menuitem">Tema claro</button>
      <button id="mAbout" role="menuitem">Acerca de / bibliografía</button>
    </div>
  </div>
  <button class="btn mobile-only" id="btnRight">Ficha</button>
</nav>

<aside id="left" class="panel" aria-label="Estructuras">
  <div class="head">
    <button class="icon-btn mobile-only drawer-close" data-close="left" aria-label="Cerrar">×</button>
    <div class="searchwrap"><input id="search" type="search" class="search" placeholder="Buscar… (ej. hipocampo, Parkinson)" autocomplete="off" aria-label="Buscar estructura"><button id="searchClear" class="hidden" aria-label="Borrar búsqueda">×</button></div>
    <div class="hint">Clic en un nombre para ver su ficha · ojo para mostrar u ocultar · <span class="kbd">/</span> buscar</div>
  </div>
  <button id="showAll" class="btn sm hidden">Mostrar todas las estructuras</button>
  <div id="noResults" class="hidden">Sin resultados. Prueba con otro término o consulta el glosario.</div>
  <div id="groups"></div>
</aside>

<aside id="right" class="panel" aria-label="Ficha" aria-live="polite"><button class="icon-btn mobile-only drawer-close" data-close="right" aria-label="Cerrar">×</button><div id="info"></div></aside>

<div id="quizCard" class="panel hidden" role="region" aria-label="Autoevaluación"></div>

<footer id="dock" class="panel">
  <div class="drow">
    <div class="ctl">
      <label for="explode">Separar partes <output id="explodeVal">0%</output></label>
      <input type="range" id="explode" min="0" max="100" value="0">
    </div>
    <div class="ctl">
      <label for="cortexOp">Opacidad corteza <output id="opVal">100%</output></label>
      <input type="range" id="cortexOp" min="4" max="100" value="100">
    </div>
    <button class="btn sm mobile-only" id="dockMore" aria-expanded="false">Más ▾</button>
    <div class="ctl more">
      <label id="hemiLbl">Hemisferios</label>
      <div class="seg" id="hemi" role="group" aria-labelledby="hemiLbl"><button data-v="L" aria-pressed="false">Izq.</button><button data-v="both" class="on" aria-pressed="true">Ambos</button><button data-v="R" aria-pressed="false">Der.</button></div>
    </div>
    <div class="ctl more">
      <label for="cutMode">Plano de corte <output id="cutVal"></output></label>
      <div class="row">
        <select id="cutMode" aria-label="Plano de corte">
          <option value="none">Sin corte</option>
          <option value="sag">Sagital</option>
          <option value="cor">Coronal</option>
          <option value="axi">Axial (horizontal)</option>
        </select>
        <input type="range" id="cutPos" min="-100" max="100" value="0" disabled style="width:88px" aria-label="Posición del corte">
        <button class="btn sm" id="cutFlip" title="Conservar el otro lado" aria-label="Conservar el otro lado" disabled>⇄</button>
        <select id="cutPreset" aria-label="Cortes clásicos"><option value="">Cortes clásicos…</option></select>
      </div>
    </div>
  </div>
  <div class="drow more">
    <div class="row"><span class="mini" id="viewLbl">Vista</span>
      <div class="seg" id="views" role="group" aria-labelledby="viewLbl">
        <button data-view="left" title="Cara lateral del hemisferio izquierdo" aria-pressed="false">Izq.</button>
        <button data-view="right" title="Cara lateral del hemisferio derecho" aria-pressed="false">Der.</button>
        <button data-view="front" title="Vista anterior (frontal)" aria-pressed="false">Anterior</button>
        <button data-view="back" title="Vista posterior (occipital)" aria-pressed="false">Posterior</button>
        <button data-view="top" title="Vista superior (dorsal)" aria-pressed="false">Superior</button>
        <button data-view="bottom" title="Vista inferior (base del cerebro)" aria-pressed="false">Inferior</button>
        <button data-view="medial" title="Cara medial: se oculta el hemisferio izquierdo" aria-pressed="false">Medial</button>
      </div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="tLabels"> Etiquetas</label>
      <label class="chk"><input type="checkbox" id="tReal"> Color real</label>
      <label class="chk"><input type="checkbox" id="tRotate"> Girar</label>
    </div>
  </div>
</footer>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box"><button class="close" aria-label="Cerrar">×</button><div id="modalBody"></div></div></div>
<div id="printArea" aria-hidden="true"></div>

<!-- @scripts -->
</body>
</html>
